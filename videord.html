<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stremio Stream Player</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        video { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 10px; color: #00ffcc; }
        p { color: #a6b0c5; font-size: 14px; margin-bottom: 20px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: #00ffcc; color: #000; }
        .btn-secondary { background: #27334a; color: #fff; border: 1px solid #394358; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .toast { position: fixed; top: 20px; background: #222; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📺 Stream Ready</h1>
        <p>If the video doesn't start automatically, select an external player below.</p>
        
        <video id="player" controls autoplay playsinline>
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="btn-group" id="externalPlayers"></div>
    </div>

    <div class="toast" id="toast">Opening external player...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let mediaUrl = urlParams.get('url');

        if (!mediaUrl) {
            document.body.innerHTML = '<h1>❌ No video URL provided.</h1>';
            throw new Error('No URL');
        }

        // 🚨 FIX: Ensure the URL has the correct https:// scheme
        if (mediaUrl.startsWith('https//')) {
            mediaUrl = mediaUrl.replace('https//', 'https://');
        } else if (!mediaUrl.startsWith('http')) {
            mediaUrl = 'https://' + mediaUrl;
        }

        const videoElement = document.getElementById('player');
        const sourceElement = document.getElementById('videoSource');
        sourceElement.src = mediaUrl;
        videoElement.load();

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isDesktop = !isAndroid && !isIOS;

        const btnGroup = document.getElementById('externalPlayers');

        function addButton(label, href, isPrimary = false) {
            const a = document.createElement('a');
            a.className = `btn ${isPrimary ? 'btn-primary' : 'btn-secondary'}`;
            a.innerText = label;
            a.href = href;
            a.target = "_blank";
            btnGroup.appendChild(a);
        }

        const encodedUrl = encodeURIComponent(mediaUrl);

        if (isAndroid) {
            // 🚨 FIX: Proper Android Intent format
            addButton('▶️ Play in VLC', `intent://${mediaUrl.replace('https://', '')}#Intent;package=org.videolan.vlc;type=video;scheme=https;end`, true);
            addButton('▶️ Play in MX Player', `intent://${mediaUrl.replace('https://', '')}#Intent;package=com.mxtech.videoplayer.ad;type=video;scheme=https;end`);
        } else if (isIOS) {
            addButton('▶️ Play in VLC', `vlc-x-callback://x-callback-url/stream?url=${encodedUrl}`, true);
            addButton('▶️ Play in Infuse', `infuse://x-callback-url/play?url=${encodedUrl}`);
        } else {
            addButton('💻 Play in VLC', `vlc://${mediaUrl}`, true);
        }

        addButton('🌐 Raw Link (Copy)', mediaUrl);

        // Auto-Redirect on Mobile
        if (isAndroid || isIOS) {
            setTimeout(() => {
                document.getElementById('toast').style.opacity = '1';
                
                if (isAndroid) {
                    // Remove https:// for the intent scheme
                    window.location.href = `intent://${mediaUrl.replace('https://', '')}#Intent;package=org.videolan.vlc;type=video;scheme=https;end`;
                } else if (isIOS) {
                    window.location.href = `vlc-x-callback://x-callback-url/stream?url=${encodedUrl}`;
                }

                setTimeout(() => { document.getElementById('toast').style.opacity = '0'; }, 3000);
            }, 1500);
        }
    </script>
</body>
</html>
