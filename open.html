<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Launching Player…</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 40px; background: #18181b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    h2 { color: #00ffcc; }
    .loader { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .btn { padding: 12px 20px; border-radius: 8px; background: #00ffcc; color: #000; text-decoration: none; font-weight: bold; margin-top: 20px; display: inline-block; }
  </style>
</head>
<body>
  <h2>Opening external player…</h2>
  <div class="loader" id="loader"></div>
  <p id="msg">If nothing happens, make sure VLC or MX Player is installed.</p>
  <a href="#" id="manualBtn" class="btn" style="display: none;">Click here to open manually</a>

  <script>
    const to = new URLSearchParams(location.search).get('to');
    
    if (to) {
      const manualBtn = document.getElementById('manualBtn');
      manualBtn.href = to;
      manualBtn.style.display = 'inline-block';

      // Auto-redirect to the app (Android intent or iOS callback)
      setTimeout(() => { 
        window.location.href = to; 
        
        // Hide loader after a few seconds
        setTimeout(() => {
          document.getElementById('loader').style.display = 'none';
          document.getElementById('msg').textContent = 'If the app did not open automatically, click the button below.';
        }, 2500);
      }, 100);
    } else {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('msg').textContent = '❌ Missing target URL. Please re-select the stream.';
    }
  </script>
</body>
</html>
