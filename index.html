<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Activity</title>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        video { width: 100%; max-width: 800px; max-height: 80vh; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <video id="player" controls playsinline>
        <source id="videoSource" src="" type="video/mp4">
    </video>
    <div id="status">Waiting for video URL...</div>

    <!-- Discord Embedded App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/dist/embedded-app-sdk.js"></script>
    <script>
        async function setup() {
            // Try to initialize the Discord SDK (will fail silently if opened outside Discord)
            try {
                // REPLACE 'YOUR_APP_ID' WITH YOUR ACTUAL DISCORD APPLICATION ID
                const discordSdk = new window.DiscordSDK('YOUR_APP_ID'); 
                await discordSdk.ready();
                console.log("Discord SDK ready");
            } catch (e) {
                console.log("Not running inside Discord Activity, or App ID is missing.");
            }

            // Parse the URL (your bot sends 'url', but we check 'videoUrl' just in case)
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url') || urlParams.get('videoUrl');
            
            const videoElement = document.getElementById('player');
            const sourceElement = document.getElementById('videoSource');
            const statusElement = document.getElementById('status');

            if (videoUrl) {
                let cleanUrl = videoUrl;
                if (cleanUrl.startsWith('https//')) cleanUrl = cleanUrl.replace('https//', 'https://');
                if (!cleanUrl.startsWith('http')) cleanUrl = 'https://' + cleanUrl;

                sourceElement.src = cleanUrl;
                videoElement.load();
                statusElement.innerText = "Playing...";
                
                // Attempt to auto-play
                videoElement.play().catch(e => {
                    statusElement.innerText = "Click play to start.";
                });
            } else {
                statusElement.innerText = "No video URL provided.";
            }
        }
        setup().catch(console.error);
    </script>
</body>
</html>
