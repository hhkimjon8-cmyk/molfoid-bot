<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Activity</title>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        video { width: 100%; max-width: 1000px; max-height: 80vh; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; }
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
        .input-group { display: none; gap: 10px; margin-top: 20px; }
        .input-group input { padding: 10px; border-radius: 5px; border: 1px solid #333; background: #222; color: #fff; width: 300px; outline: none; }
        .input-group button { padding: 10px 20px; border-radius: 5px; border: none; background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <video id="player" controls playsinline crossorigin="anonymous">
        <source id="videoSource" src="" type="video/mp4">
    </video>
    <div id="status">Waiting for video URL...</div>
    
    <div class="input-group" id="manualInput">
        <input type="text" id="urlInput" placeholder="Paste direct video URL here...">
        <button onclick="loadManualUrl()">Play</button>
    </div>

    <!-- Discord Embedded App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/dist/embedded-app-sdk.js"></script>
    <script>
        let mediaUrl = null;
        try {
            const urlParams = new URLSearchParams(window.location.search);
            mediaUrl = urlParams.get('url') || urlParams.get('videoUrl') || urlParams.get('src');
            if (!mediaUrl && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                mediaUrl = hashParams.get('url') || hashParams.get('videoUrl');
            }
        } catch (e) {
            console.error("Error parsing URL", e);
        }

        if (mediaUrl) {
            try { mediaUrl = decodeURIComponent(mediaUrl); } catch(e){}
            if (mediaUrl.startsWith('https//')) mediaUrl = mediaUrl.replace('https//', 'https://');
            if (!mediaUrl.startsWith('http')) mediaUrl = 'https://' + mediaUrl;
        }

        async function setup() {
            try {
                // Using your specific App ID
                const discordSdk = new window.DiscordSDK('1557794760037769367'); 
                await discordSdk.ready();
                console.log("Discord SDK ready");
            } catch (e) {
                console.log("Not running inside Discord Activity, or App ID is missing.");
            }

            const videoElement = document.getElementById('player');
            const sourceElement = document.getElementById('videoSource');
            const statusElement = document.getElementById('status');
            const manualInput = document.getElementById('manualInput');

            if (mediaUrl) {
                startPlayback(mediaUrl);
            } else {
                statusElement.innerText = "No video URL provided. Please paste it below:";
                manualInput.style.display = 'flex';
            }
        }

        function loadManualUrl() {
            let url = document.getElementById('urlInput').value.trim();
            if (url) {
                if (url.startsWith('https//')) url = url.replace('https//', 'https://');
                if (!url.startsWith('http')) url = 'https://' + url;
                mediaUrl = url;
                
                document.getElementById('manualInput').style.display = 'none';
                startPlayback(url);
            }
        }

        function startPlayback(url) {
            const videoElement = document.getElementById('player');
            const sourceElement = document.getElementById('videoSource');
            const statusElement = document.getElementById('status');

            sourceElement.src = url;
            videoElement.style.display = 'block';
            videoElement.load();
            statusElement.innerText = "Playing...";
            
            videoElement.play().catch(e => {
                statusElement.innerText = "Click play to start.";
            });
        }

        setup().catch(console.error);
    </script>
</body>
</html>
