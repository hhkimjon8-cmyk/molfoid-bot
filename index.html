<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molfoid Stream Player</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        video { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin-bottom: 10px; color: #00ffcc; }
        p { color: #a6b0c5; font-size: 14px; margin-bottom: 20px; }
        #status { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 Molfoid Player</h1>
        <p>Loading your stream...</p>
        <video id="player" controls autoplay playsinline>
            <source id="videoSource" src="" type="video/mp4">
        </video>
        <div id="status"></div>
    </div>

    <!-- REQUIRED: Discord Embedded App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/dist/embedded-app-sdk.js"></script>
    <script>
        // Initialize the Discord SDK
        const discordSdk = new window.DiscordSDK('YOUR_APP_ID'); // Replace with your App ID

        async function setup() {
            await discordSdk.ready();
            
            // Get the video URL passed from the bot via query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const videoTitle = urlParams.get('title') || 'Stream';

            const videoElement = document.getElementById('player');
            const sourceElement = document.getElementById('videoSource');
            const statusElement = document.getElementById('status');

            if (videoUrl) {
                // Extract clean URL if it's an intent link
                let playUrl = videoUrl;
                if (playUrl.startsWith('intent://')) {
                    const match = playUrl.match(/intent:\/\/(https?:\/\/[^#]+)/);
                    if (match) playUrl = match[1];
                }
                
                sourceElement.src = playUrl;
                videoElement.load();
                statusElement.innerText = `Playing: ${videoTitle}`;
                
                // Attempt to auto-play
                videoElement.play().catch(() => {
                    statusElement.innerText = "Click Play to start the video.";
                });
            } else {
                statusElement.innerText = "No video URL provided.";
            }
        }
        
        setup().catch(err => {
            console.error(err);
            document.getElementById('status').innerText = "Error loading Activity.";
        });
    </script>
</body>
</html>
