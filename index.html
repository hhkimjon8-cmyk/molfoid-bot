<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stremio Stream Player</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        video { width: 100%; max-height: 50vh; background: #000; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; }
        h1 { font-size: 20px; margin-bottom: 10px; color: #00ffcc; }
        p { color: #a6b0c5; font-size: 14px; margin-bottom: 20px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; display: inline-block; }
        .btn-primary { background: #00ffcc; color: #000; }
        .btn-secondary { background: #27334a; color: #fff; border: 1px solid #394358; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .toast { position: fixed; top: 20px; background: #222; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; font-size: 14px; z-index: 9999; pointer-events: none; }
        
        /* Added styles for manual input fallback */
        .input-group { display: none; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 600px; }
        .input-group input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #394358; background: #1a2235; color: #fff; outline: none; font-size: 14px; }
        .input-group button { padding: 12px 20px; border-radius: 8px; border: none; background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📺 Stream Ready</h1>
        <p id="statusText">Loading...</p>
        
        <div class="input-group" id="manualInput">
            <input type="text" id="urlInput" placeholder="Paste direct video URL here...">
            <button onclick="loadManualUrl()">Play</button>
        </div>

        <video id="player" controls autoplay playsinline crossorigin="anonymous">
            <source id="videoSource" src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="btn-group" id="externalPlayers"></div>
    </div>

    <div class="toast" id="toast">Opening external player...</div>

    <script>
        // Try to get URL from query params, then hash
        let mediaUrl = null;
        try {
            const urlParams = new URLSearchParams(window.location.search);
            mediaUrl = urlParams.get('url');
            
            // Fallback: try to parse from hash if not found in query
            if (!mediaUrl && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                mediaUrl = hashParams.get('url');
            }
        } catch (e) {
            console.error("Failed to parse URL params", e);
        }

        // Clean up the URL
        if (mediaUrl) {
            try { mediaUrl = decodeURIComponent(mediaUrl); } catch(e){}
            if (mediaUrl.startsWith('https//')) mediaUrl = mediaUrl.replace('https//', 'https://');
            if (!mediaUrl.startsWith('http')) mediaUrl = 'https://' + mediaUrl;
        }

        const videoElement = document.getElementById('player');
        const sourceElement = document.getElementById('videoSource');
        const btnGroup = document.getElementById('externalPlayers');
        const statusText = document.getElementById('statusText');
        const manualInputDiv = document.getElementById('manualInput');

        if (!mediaUrl) {
            statusText.innerText = "❌ No video URL provided. Please paste the direct link below.";
            manualInputDiv.style.display = 'flex';
            btnGroup.style.display = 'none';
        } else {
            initPlayer(mediaUrl);
        }

        function loadManualUrl() {
            let url = document.getElementById('urlInput').value.trim();
            if (url) {
                if (url.startsWith('https//')) url = url.replace('https//', 'https://');
                if (!url.startsWith('http')) url = 'https://' + url;
                mediaUrl = url;
                manualInputDiv.style.display = 'none';
                initPlayer(url);
            }
        }

        function initPlayer(url) {
            statusText.innerText = "If the video doesn't start automatically, select an external player below.";
            
            sourceElement.src = url;
            videoElement.style.display = 'block';
            videoElement.load();
            
            videoElement.onerror = () => {
                statusText.innerText = "⚠️ Browser cannot play this format directly. Use an external player below.";
                videoElement.style.display = 'none';
            };

            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            btnGroup.innerHTML = ''; // Clear existing buttons
            btnGroup.style.display = 'flex';

            function addButton(label, href, isPrimary = false) {
                const a = document.createElement('a');
                a.className = `btn ${isPrimary ? 'btn-primary' : 'btn-secondary'}`;
                a.innerText = label;
                a.href = href;
                a.target = "_blank";
                btnGroup.appendChild(a);
            }

            const encodedUrl = encodeURIComponent(url);
            const cleanUrl = url.replace('https://', '').replace('http://', '');

            if (isAndroid) {
                // Android Intents (Requires the URL to NOT have https://)
                addButton('▶️ Play in VLC', `intent://${cleanUrl}#Intent;package=org.videolan.vlc;type=video;scheme=https;end`, true);
                addButton('▶️ Play in MX Player', `intent://${cleanUrl}#Intent;package=com.mxtech.videoplayer.ad;type=video;scheme=https;end`);
            } else if (isIOS) {
                addButton('▶️ Play in VLC', `vlc-x-callback://x-callback-url/stream?url=${encodedUrl}`, true);
                addButton('▶️ Play in Infuse', `infuse://x-callback-url/play?url=${encodedUrl}`);
            } else {
                addButton('💻 Play in VLC', `vlc://${url}`, true);
            }

            addButton('🌐 Raw Link (Copy)', url);

            // Auto-Redirect on Mobile to VLC after 2 seconds
            if (isAndroid || isIOS) {
                setTimeout(() => {
                    const toast = document.getElementById('toast');
                    toast.style.opacity = '1';
                    
                    if (isAndroid) {
                        window.location.href = `intent://${cleanUrl}#Intent;package=org.videolan.vlc;type=video;scheme=https;end`;
                    } else if (isIOS) {
                        window.location.href = `vlc-x-callback://x-callback-url/stream?url=${encodedUrl}`;
                    }

                    setTimeout(() => { toast.style.opacity = '0'; }, 3000);
                }, 2000);
            }
        }
    </script>
</body>
</html>
