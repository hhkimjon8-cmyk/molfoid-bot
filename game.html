<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Escape - Play</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #error-message {
            display: none;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- 
      The sandbox attribute is key here:
      - allow-scripts: Lets the game run its JavaScript.
      - allow-same-origin: Lets the game load assets from its own server.
      - We OMIT 'allow-popups', which forcibly blocks all Adsterra pop-ups!
    -->
    <iframe 
        id="gameFrame"
        src="https://cdn.yad.com/Brainrot-Escape-Diamond-Quest/index.html?yad"
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
        allowfullscreen>
    </iframe>

    <!-- Fallback if the site blocks iframes -->
    <div id="error-message">
        <h2>⚠️ Game cannot be embedded.</h2>
        <p>The game server is blocking iframe connections.</p>
        <a href="https://cdn.yad.com/Brainrot-Escape-Diamond-Quest/index.html?yad" target="_blank" style="color: #00ffcc; font-size: 20px;">
            Click here to play in a new tab
        </a>
    </div>

    <script>
        // Check if the iframe failed to load (X-Frame-Options block)
        const iframe = document.getElementById('gameFrame');
        
        setTimeout(() => {
            try {
                // If the iframe body is empty, it was likely blocked by the website
                if (iframe.contentDocument && iframe.contentDocument.body.innerHTML === "") {
                    iframe.style.display = 'none';
                    document.getElementById('error-message').style.display = 'block';
                }
            } catch (e) {
                // Cross-origin restrictions mean we can't read the iframe, which means it loaded!
                console.log("Game loaded successfully.");
            }
        }, 3000);
    </script>
</body>
</html>
