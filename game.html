<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Molfoid Web Games</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        
        body, html { 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; 
            background-color: #000; 
            overflow: hidden; 
            position: fixed; 
            top: 0; 
            left: 0; 
            touch-action: none;
        }

        #gameFrame { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }

        #loading { 
            color: #00ffcc; 
            font-family: sans-serif; 
            text-align: center; 
            margin-top: 40vh; 
            position: absolute; 
            width: 100%; 
            z-index: 10; 
            font-size: 20px;
            font-weight: bold;
        }

        /* Fullscreen Button Overlay */
        #fs-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 26, 33, 0.9); 
            color: white; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; padding: 20px;
            backdrop-filter: blur(5px);
        }

        #fs-btn {
            background: #00ffcc;
            color: #141A21;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s;
        }

        #fs-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="loading">🎮 Loading Game...</div>
    
    <!-- Fullscreen / Landscape Prompt -->
    <div id="fs-overlay">
        <h1 style="font-size: 40px; margin-bottom: 10px;">🎮</h1>
        <h2>Ready to Play?</h2>
        <p style="margin-top: 10px; color: #aaa; text-align: center;">Tap below for fullscreen (Landscape recommended)</p>
        <button id="fs-btn">▶️ Play Fullscreen</button>
    </div>

    <iframe id="gameFrame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-orientation-lock allow-fullscreen" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameSrc = urlParams.get('src');
        
        if (gameSrc) {
            const iframe = document.getElementById('gameFrame');
            const loading = document.getElementById('loading');
            const fsOverlay = document.getElementById('fs-overlay');
            const fsBtn = document.getElementById('fs-btn');

            // Load the game through the proxy
            iframe.src = `/api/proxy?url=${encodeURIComponent(gameSrc)}`;
            
            // Hide loading text once iframe loads
            iframe.onload = () => {
                loading.style.display = 'none';
            };

            // Enter Fullscreen + Landscape Lock
            fsBtn.addEventListener('click', async () => {
                try {
                    const docEl = document.documentElement;
                    
                    // 1. Request Fullscreen
                    if (docEl.requestFullscreen) {
                        await docEl.requestFullscreen();
                    } else if (docEl.webkitRequestFullscreen) {
                        await docEl.webkitRequestFullscreen();
                    }

                    // 2. Lock Orientation to Landscape (Mobile only)
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {
                            console.log("Orientation lock failed or not supported.");
                        });
                    }
                } catch (err) {
                    console.log("Fullscreen request failed", err);
                }
                
                // Hide the overlay so the game is visible
                fsOverlay.style.display = 'none';
            });

        } else {
            document.getElementById('loading').innerHTML = '❌ No game specified.';
        }
    </script>
</body>
</html>
