<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Molfoid Web Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; height: 100%; background-color: #000; overflow: hidden; 
            position: fixed; top: 0; left: 0; 
        }
        #loading { color: white; font-family: sans-serif; text-align: center; margin-top: 40vh; }
    </style>
</head>
<body>
    <div id="loading">🎮 Loading Game...</div>

    <script>
        // 1. Get the game URL from the bot (?src=https://...)
        const urlParams = new URLSearchParams(window.location.search);
        const gameSrc = urlParams.get('src');
        
        if (gameSrc) {
            // 2. Fetch the proxied HTML
            fetch(`/api/proxy?url=${encodeURIComponent(gameSrc)}`)
                .then(res => res.text())
                .then(html => {
                    // 3. Overwrite the entire page with the game's HTML
                    document.open();
                    document.write(html);
                    document.close();
                    
                    // 4. Auto Fullscreen on first click
                    function enterFullscreen() {
                        if (document.documentElement.requestFullscreen) {
                            document.documentElement.requestFullscreen().catch(() => {});
                        }
                        document.removeEventListener('click', enterFullscreen);
                        document.removeEventListener('touchstart', enterFullscreen);
                    }
                    document.addEventListener('click', enterFullscreen);
                    document.addEventListener('touchstart', enterFullscreen);
                })
                .catch(err => {
                    document.getElementById('loading').innerHTML = '❌ Failed to load game.';
                });
        } else {
            document.getElementById('loading').innerHTML = '❌ No game specified.';
        }
    </script>
</body>
</html>
