<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is crucial for modern phone screens with notches -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Molfoid Web Games</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            /* Prevents accidental highlights when tapping rapidly */
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        
        body, html { 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh; /* Fixes the mobile address bar overlap */
            background-color: #000; 
            overflow: hidden; 
            /* Stops mobile users from pulling the page to refresh or scrolling */
            position: fixed; 
            top: 0; 
            left: 0; 
            touch-action: none;
        }

        #gameFrame { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }

        #loading { 
            color: #00ffcc; 
            font-family: sans-serif; 
            text-align: center; 
            margin-top: 40vh; 
            position: absolute; 
            width: 100%; 
            z-index: 10; 
            font-size: 20px;
            font-weight: bold;
        }

        /* Rotate overlay for mobile users playing in portrait */
        #rotate-device {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #141A21; color: white; z-index: 9999;
            text-align: center; flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; padding: 20px;
        }
        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-device { display: flex; }
        }
    </style>
</head>
<body>
    <div id="loading">🎮 Loading Game...</div>
    
    <!-- Portrait warning -->
    <div id="rotate-device">
        <h1 style="font-size: 40px; margin-bottom: 10px;">📱🔄</h1>
        <h2>Please Rotate Your Device</h2>
        <p style="margin-top: 10px; color: #aaa;">This game is best played in landscape mode.</p>
    </div>

    <!-- Sandbox allows scripts and saves, but blocks popups -->
    <iframe id="gameFrame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-orientation-lock allow-fullscreen" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameSrc = urlParams.get('src');
        
        if (gameSrc) {
            const iframe = document.getElementById('gameFrame');
            // Load the game through the proxy
            iframe.src = `/api/proxy?url=${encodeURIComponent(gameSrc)}`;
            
            // Hide loading screen once the iframe loads
            iframe.onload = () => {
                document.getElementById('loading').style.display = 'none';
            };

            // Auto Fullscreen on first click/touch
            function enterFullscreen() {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen().catch(() => {});
                } else if (docEl.webkitRequestFullscreen) { /* Safari */
                    docEl.webkitRequestFullscreen();
                }
                // Remove listeners so it only triggers once
                document.removeEventListener('click', enterFullscreen);
                document.removeEventListener('touchstart', enterFullscreen);
            }
            document.addEventListener('click', enterFullscreen);
            document.addEventListener('touchstart', enterFullscreen);
            
        } else {
            document.getElementById('loading').innerHTML = '❌ No game specified.';
        }
    </script>
</body>
</html>
